<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <defs>
    <!-- Voxel Grid Pattern -->
    <pattern id="voxel-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 16 L 16 16 L 16 0" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    
    <linearGradient id="pickaxe-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0aec0"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    
    <radialGradient id="ai-core-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#ec4899" flood-opacity="0.7" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in" result="glow-part"/>
      <feMerge>
        <feMergeNode in="glow-part"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="code-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" ry="64" fill="url(#bg-gradient)" />
  
  <!-- Voxel Grid Overlay (Minecraft feel) -->
  <rect width="512" height="512" fill="url(#voxel-grid)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ec4899" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Pickaxe (stylized code-blade) -->
  <g transform="translate(256,256) rotate(-40) scale(1.1)" filter="url(#glow)">
    <!-- Handle -->
    <rect x="-12" y="32" width="24" height="136" rx="6" fill="#d97706" />
    <rect x="-8" y="36" width="16" height="128" rx="4" fill="#f59e0b" />
    
    <!-- Handle binding -->
    <rect x="-16" y="28" width="32" height="8" fill="#4f46e5" />

    <!-- Blade: Code Bracket Shape -->
    <path d="M-100,-30 
             C-80,-35 -80,-10 -100,0 
             C-80,10 -80,35 -100,30 
             L-120,0 Z" 
          fill="url(#pickaxe-metal)" />
    <path d="M100,-30 
             C80,-35 80,-10 100,0 
             C80,10 80,35 100,30 
             L120,0 Z" 
          fill="url(#pickaxe-metal)" />
    
    <!-- Central core (AI node) -->
    <circle cx="0" cy="0" r="16" fill="url(#ai-core-glow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.8" />

    <!-- Circuit traces -->
    <path d="M-80,0 L-40,0 M40,0 L80,0" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating AI Node Cluster -->
  <g transform="translate(256,330)">
    <!-- Nodes -->
    <circle cx="0" cy="0" r="14" fill="#ec4899" />
    <circle cx="-40" cy="10" r="8" fill="#3b82f6" />
    <circle cx="40" cy="10" r="8" fill="#10b981" />
    <circle cx="20" cy="-20" r="6" fill="#f59e0b" />
    
    <!-- Neural connections -->
    <line x1="0" y1="0" x2="-36" y2="8" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="0" y1="0" x2="36" y2="8" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="0" y1="0" x2="18" y2="-18" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Pulse animation hint -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5">
      <animate attributeName="r" values="20;26;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- { } Code Badge -->
  <g transform="translate(420,90)" filter="url(#code-glow)">
    <rect x="-30" y="-22" width="60" height="44" rx="11" fill="#000000" opacity="0.6"/>
    <text x="0" y="12" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- AI Badge -->
  <g transform="translate(400,140)">
    <rect x="-28" y="-18" width="56" height="36" rx="12" fill="#ffffff"/>
    <text x="0" y="8" font-family="Arial Black" font-size="28" font-weight="900" fill="#8b5cf6" text-anchor="middle">AI</text>
  </g>
</svg>
