<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pickaxe-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square (Minecraft block style) -->
  <rect x="32" y="32" width="448" height="448" rx="48" ry="48" fill="url(#bg-gradient)"/>
  
  <!-- Inner shadow/depth -->
  <rect x="48" y="48" width="416" height="416" rx="40" ry="40" fill="#1e1b4b" opacity="0.3"/>
  
  <!-- Minecraft block pattern (subtle grid) -->
  <g opacity="0.1" stroke="#fff" stroke-width="2">
    <line x1="170" y1="32" x2="170" y2="480"/>
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="342" y1="32" x2="342" y2="480"/>
    <line x1="32" y1="170" x2="480" y2="170"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="32" y1="342" x2="480" y2="342"/>
  </g>
  
  <!-- Pickaxe (Minecraft symbol) -->
  <g transform="translate(256, 240) rotate(-45)" filter="url(#glow)">
    <!-- Handle -->
    <rect x="-12" y="20" width="24" height="140" rx="6" fill="#92400e"/>
    <rect x="-8" y="24" width="16" height="132" rx="4" fill="#b45309"/>
    
    <!-- Pickaxe head -->
    <path d="M-80,-30 L-20,-30 L-20,30 L-80,30 L-100,0 Z" fill="url(#pickaxe-gradient)"/>
    <path d="M80,-30 L20,-30 L20,30 L80,30 L100,0 Z" fill="url(#pickaxe-gradient)"/>
    <rect x="-20" y="-30" width="40" height="60" fill="url(#pickaxe-gradient)"/>
    
    <!-- Pickaxe shine -->
    <path d="M-70,-20 L-30,-20 L-30,0 L-70,0 L-80,-10 Z" fill="#fff" opacity="0.3"/>
    <path d="M70,-20 L30,-20 L30,0 L70,0 L80,-10 Z" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- AI Brain/Circuit symbol -->
  <g transform="translate(256, 320)" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="24" fill="url(#ai-gradient)"/>
    <circle cx="0" cy="0" r="16" fill="#fff" opacity="0.3"/>
    
    <!-- Connection lines -->
    <line x1="0" y1="-24" x2="0" y2="-60" stroke="url(#ai-gradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="0" x2="70" y2="0" stroke="url(#ai-gradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-24" y1="0" x2="-70" y2="0" stroke="url(#ai-gradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="17" y1="17" x2="50" y2="50" stroke="url(#ai-gradient)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-17" y1="17" x2="-50" y2="50" stroke="url(#ai-gradient)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Outer nodes -->
    <circle cx="0" cy="-70" r="12" fill="url(#ai-gradient)"/>
    <circle cx="80" cy="0" r="12" fill="url(#ai-gradient)"/>
    <circle cx="-80" cy="0" r="12" fill="url(#ai-gradient)"/>
    <circle cx="55" cy="55" r="10" fill="url(#ai-gradient)"/>
    <circle cx="-55" cy="55" r="10" fill="url(#ai-gradient)"/>
  </g>
  
  <!-- "AI" text badge -->
  <g transform="translate(400, 120)">
    <rect x="-40" y="-24" width="80" height="48" rx="12" fill="#fff"/>
    <text x="0" y="10" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="url(#bg-gradient)" text-anchor="middle">AI</text>
  </g>
</svg>
