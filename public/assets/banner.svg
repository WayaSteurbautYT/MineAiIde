<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" shape-rendering="crispEdges">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a17"/>
      <stop offset="50%" stop-color="#171535"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>

    <!-- Glows -->
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.5" result="glow"/>
      <feComposite in="glow" in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animated Particles -->
    <style>
      .particle { animation: float 8s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { r: 1.5; opacity: 0.4; }
        50% { r: 2.5; opacity: 0.8; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { stroke-width: 1; stroke-opacity: 0.8; }
        50% { stroke-width: 2; stroke-opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#hero-bg)" />

  <!-- Floating block particles -->
  <g opacity="0.2">
    <rect x="100" y="100" width="16" height="16" fill="#fff" class="particle"/>
    <rect x="250" y="80" width="16" height="16" fill="#8b5cf6" class="particle"/>
    <rect x="1200" y="110" width="16" height="16" fill="#ec4899" class="particle"/>
    <rect x="1100" y="500" width="16" height="16" fill="#06b6d4" class="particle"/>
    <rect x="200" y="550" width="16" height="16" fill="#10b981" class="particle"/>
  </g>

  <!-- Floating Neural Network Glow -->
  <g filter="url(#soft-glow)" opacity="0.5">
    <circle cx="280" cy="340" r="120" fill="#7c3aed" opacity="0.3"/>
    <circle cx="1000" cy="360" r="80" fill="#ec4899" opacity="0.2"/>
  </g>

  <!-- Subtle Minecraft Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <!-- Vertical -->
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
    <!-- Horizontal -->
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- Left: App Icon (mini version) -->
  <g transform="translate(200,320) scale(0.7)">
    <!-- Reuse simplified icon logic -->
    <rect x="-80" y="-80" width="160" height="160" rx="40" fill="#3730a3"/>

    <!-- Pickaxe with code blade -->
    <g transform="rotate(-40)">
      <rect x="-6" y="16" width="12" height="68" fill="#d97706"/>
      <path d="M-50,-15 C-40,-17 -40,-5 -50,0 C-40,5 -40,17 -50,15 L-60,0 Z" fill="#a0aec0"/>
      <circle cx="0" cy="0" r="6" fill="#ec4899"/>
    </g>

    <!-- AI Cluster -->
    <g transform="translate(0,40)">
      <circle cx="0" cy="0" r="8" fill="#ec4899"/>
      <circle cx="-20" cy="6" r="4" fill="#3b82f6"/>
      <circle cx="20" cy="6" r="4" fill="#10b981"/>
      <line x1="0" y1="0" x2="-16" y2="4" stroke="#8b5cf6" stroke-width="1"/>
      <line x1="0" y1="0" x2="16" y2="4" stroke="#8b5cf6" stroke-width="1"/>
    </g>
  </g>

  <!-- Right: Text Content -->
  <g transform="translate(400,220)">
    <!-- Title -->
    <text x="0" y="0" font-family="Orbitron, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#ffffff" text-anchor="left" filter="url(#text-glow)">
      MineAI IDE
    </text>

    <!-- Subtitle -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="24" fill="#a5b4fc" text-anchor="left">
      Build Minecraft mods with natural language.
    </text>
    <text x="0" y="96" font-family="Arial, sans-serif" font-size="24" fill="#c4b5fd" text-anchor="left">
      No Java? No problem. Just describe.
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0,150)" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold">
      <g transform="translate(0,0)">
        <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
        <text y="5" fill="#ffffff">FORGE</text>
      </g>
      <g transform="translate(80,0)">
        <rect x="-35" y="-15" width="70" height="30" rx="15" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
        <text y="5" fill="#1c1917">FABRIC</text>
      </g>
      <g transform="translate(160,0)">
        <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#3b82f6" stroke="#2563eb" stroke-width="1"/>
        <text y="5" fill="#ffffff">DATAPACK</text>
      </g>
      <g transform="translate(260,0)" class="pulse">
        <rect x="-30" y="-15" width="60" height="30" rx="15" fill="#10b981" opacity="0.3"/>
        <text y="5" fill="#22d3ee">&lt;/&gt;</text>
      </g>
    </g>

    <!-- Tagline -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="left" letter-spacing="1">
      Powered by AI • 100% Free • Open Source
    </text>
  </g>

  <!-- Bottom: Version & Code Hint -->
  <g transform="translate(640,600)">
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#1e1b4b" opacity="0.7"/>
    <text x="0" y="6" font-family="monospace" font-size="14" fill="#a5b4fc" text-anchor="middle">
      v1.2.0 • MIT Licensed • GitHub: @MineAIIde
    </text>
  </g>

  <!-- Floating Data Stream (code particles) -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round">
    <path d="M 300 300 L 320 280" opacity="0.4"/>
    <path d="M 340 260 L 360 240" opacity="0.4"/>
    <path d="M 900 280 L 930 260" opacity="0.4"/>
    <path d="M 1000 400 L 1040 370" opacity="0.4"/>
    <path d="M 200 500 L 230 480" opacity="0.4"/>
  </g>
</svg>
