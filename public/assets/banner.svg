<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1f"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="blur-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#banner-bg)"/>
  
  <!-- Animated particles/stars background -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="2" fill="#fff"/>
    <circle cx="200" cy="80" r="1.5" fill="#6366f1"/>
    <circle cx="350" cy="150" r="2" fill="#22d3ee"/>
    <circle cx="500" cy="50" r="1" fill="#fff"/>
    <circle cx="650" cy="120" r="2.5" fill="#f472b6"/>
    <circle cx="800" cy="70" r="1.5" fill="#fff"/>
    <circle cx="950" cy="140" r="2" fill="#6366f1"/>
    <circle cx="1100" cy="90" r="1" fill="#22d3ee"/>
    <circle cx="1200" cy="130" r="2" fill="#fff"/>
    <circle cx="150" cy="500" r="2" fill="#f472b6"/>
    <circle cx="300" cy="550" r="1.5" fill="#fff"/>
    <circle cx="450" cy="480" r="2" fill="#6366f1"/>
    <circle cx="600" cy="570" r="1" fill="#22d3ee"/>
    <circle cx="750" cy="520" r="2.5" fill="#fff"/>
    <circle cx="900" cy="490" r="1.5" fill="#f472b6"/>
    <circle cx="1050" cy="560" r="2" fill="#fff"/>
    <circle cx="1180" cy="510" r="1" fill="#6366f1"/>
  </g>
  
  <!-- Glowing orbs in background -->
  <g filter="url(#blur-glow)" opacity="0.3">
    <circle cx="200" cy="320" r="100" fill="#6366f1"/>
    <circle cx="1080" cy="320" r="120" fill="#8b5cf6"/>
    <circle cx="640" cy="500" r="80" fill="#22d3ee"/>
  </g>
  
  <!-- Minecraft block grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
  </g>
  
  <!-- Logo icon on left -->
  <g transform="translate(200, 320) scale(0.5)">
    <rect x="-160" y="-160" width="320" height="320" rx="48" fill="url(#purple-glow)"/>
    
    <!-- Pickaxe simplified -->
    <g transform="rotate(-45)">
      <rect x="-8" y="20" width="16" height="100" rx="4" fill="#b45309"/>
      <path d="M-60,-20 L-15,-20 L-15,20 L-60,20 L-75,0 Z" fill="url(#cyan-glow)"/>
      <path d="M60,-20 L15,-20 L15,20 L60,20 L75,0 Z" fill="url(#cyan-glow)"/>
      <rect x="-15" y="-20" width="30" height="40" fill="url(#cyan-glow)"/>
    </g>
    
    <!-- AI nodes -->
    <g transform="translate(0, 80)">
      <circle cx="0" cy="0" r="16" fill="url(#pink-glow)"/>
      <circle cx="-50" cy="0" r="8" fill="url(#pink-glow)"/>
      <circle cx="50" cy="0" r="8" fill="url(#pink-glow)"/>
      <line x1="-16" y1="0" x2="-42" y2="0" stroke="url(#pink-glow)" stroke-width="3"/>
      <line x1="16" y1="0" x2="42" y2="0" stroke="url(#pink-glow)" stroke-width="3"/>
    </g>
    
    <!-- AI badge -->
    <g transform="translate(100, -100)">
      <rect x="-30" y="-18" width="60" height="36" rx="8" fill="#fff"/>
      <text x="0" y="8" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#6366f1" text-anchor="middle">AI</text>
    </g>
  </g>
  
  <!-- Main title -->
  <g filter="url(#text-glow)">
    <text x="640" y="280" font-family="Arial Black, Helvetica, sans-serif" font-size="96" font-weight="900" fill="#fff" text-anchor="middle">
      MineAI IDE
    </text>
  </g>
  
  <!-- Subtitle -->
  <text x="640" y="350" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#a5b4fc" text-anchor="middle" letter-spacing="4">
    AI-POWERED MINECRAFT MODDING
  </text>
  
  <!-- Feature pills -->
  <g transform="translate(640, 420)">
    <!-- Forge -->
    <g transform="translate(-300, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#22c55e" opacity="0.2"/>
      <rect x="-50" y="-18" width="100" height="36" rx="18" stroke="#22c55e" stroke-width="2" fill="none"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" fill="#22c55e" text-anchor="middle" font-weight="600">FORGE</text>
    </g>
    <!-- Fabric -->
    <g transform="translate(-150, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#f59e0b" opacity="0.2"/>
      <rect x="-50" y="-18" width="100" height="36" rx="18" stroke="#f59e0b" stroke-width="2" fill="none"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle" font-weight="600">FABRIC</text>
    </g>
    <!-- Spigot -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#ef4444" opacity="0.2"/>
      <rect x="-50" y="-18" width="100" height="36" rx="18" stroke="#ef4444" stroke-width="2" fill="none"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="600">SPIGOT</text>
    </g>
    <!-- Datapack -->
    <g transform="translate(150, 0)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#3b82f6" opacity="0.2"/>
      <rect x="-55" y="-18" width="110" height="36" rx="18" stroke="#3b82f6" stroke-width="2" fill="none"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="600">DATAPACK</text>
    </g>
    <!-- Free -->
    <g transform="translate(300, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#6366f1" opacity="0.2"/>
      <rect x="-50" y="-18" width="100" height="36" rx="18" stroke="#6366f1" stroke-width="2" fill="none"/>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" fill="#6366f1" text-anchor="middle" font-weight="600">100% FREE</text>
    </g>
  </g>
  
  <!-- Tagline -->
  <text x="640" y="520" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
    Create Minecraft mods with natural language — no coding required!
  </text>
  
  <!-- Version badge -->
  <g transform="translate(640, 580)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b"/>
    <text x="0" y="5" font-family="monospace" font-size="14" fill="#22d3ee" text-anchor="middle">v1.0.0 • MIT</text>
  </g>
</svg>
