<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Window chrome -->
  <rect x="0" y="0" width="800" height="32" fill="#020617"/>
  <circle cx="16" cy="16" r="6" fill="#ef4444"/>
  <circle cx="36" cy="16" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="16" r="6" fill="#22c55e"/>
  <text x="400" y="20" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">MineAI IDE - Dashboard</text>
  
  <!-- Sidebar -->
  <rect x="0" y="32" width="200" height="418" fill="#0f172a"/>
  <text x="20" y="60" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">📁 Projects</text>
  <text x="30" y="90" font-family="Arial" font-size="12" fill="#64748b">▸ Ruby Tools Mod</text>
  <text x="30" y="115" font-family="Arial" font-size="12" fill="#64748b">▸ Teleport Staff</text>
  <text x="30" y="140" font-family="Arial" font-size="12" fill="#64748b">▸ Custom Biomes</text>
  <text x="20" y="180" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">🤖 AI Assistant</text>
  <text x="20" y="220" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">⚙️ Settings</text>
  
  <!-- Main content area -->
  <rect x="210" y="42" width="580" height="398" fill="#1e293b" rx="8"/>
  
  <!-- Welcome card -->
  <rect x="230" y="62" width="540" height="120" fill="#334155" rx="8"/>
  <text x="260" y="100" font-family="Arial" font-size="24" fill="#fff" font-weight="bold">Welcome to MineAI IDE</text>
  <text x="260" y="130" font-family="Arial" font-size="14" fill="#94a3b8">Create Minecraft mods with AI-powered code generation</text>
  <rect x="260" y="145" width="140" height="28" fill="#6366f1" rx="4"/>
  <text x="330" y="164" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">+ New Project</text>
  
  <!-- Recent projects -->
  <text x="230" y="210" font-family="Arial" font-size="16" fill="#fff" font-weight="bold">Recent Projects</text>
  
  <rect x="230" y="225" width="170" height="100" fill="#334155" rx="8"/>
  <text x="250" y="255" font-family="Arial" font-size="14" fill="#fff">💎 Ruby Tools</text>
  <text x="250" y="275" font-family="Arial" font-size="11" fill="#64748b">Forge 1.20.1</text>
  <text x="250" y="305" font-family="Arial" font-size="10" fill="#22c55e">● Ready to build</text>
  
  <rect x="415" y="225" width="170" height="100" fill="#334155" rx="8"/>
  <text x="435" y="255" font-family="Arial" font-size="14" fill="#fff">🔮 Magic Wands</text>
  <text x="435" y="275" font-family="Arial" font-size="11" fill="#64748b">Fabric 1.20.4</text>
  <text x="435" y="305" font-family="Arial" font-size="10" fill="#f59e0b">● Building...</text>
  
  <rect x="600" y="225" width="170" height="100" fill="#334155" rx="8"/>
  <text x="620" y="255" font-family="Arial" font-size="14" fill="#fff">⚔️ Battle Items</text>
  <text x="620" y="275" font-family="Arial" font-size="11" fill="#64748b">Spigot 1.21</text>
  <text x="620" y="305" font-family="Arial" font-size="10" fill="#3b82f6">● In Progress</text>
  
  <!-- AI Chat preview -->
  <text x="230" y="355" font-family="Arial" font-size="16" fill="#fff" font-weight="bold">AI Chat</text>
  <rect x="230" y="370" width="540" height="60" fill="#334155" rx="8"/>
  <text x="250" y="400" font-family="Arial" font-size="12" fill="#64748b">Ask MineAI anything... "Create a diamond pickaxe with fortune 5"</text>
  
  <!-- Placeholder indicator -->
  <rect x="300" y="180" width="200" height="30" fill="#6366f1" rx="15" opacity="0.9"/>
  <text x="400" y="200" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">📹 GIF Placeholder</text>
</svg>
