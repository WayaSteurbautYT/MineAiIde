<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <!-- Window chrome -->
  <rect x="0" y="0" width="800" height="32" fill="#020617"/>
  <circle cx="16" cy="16" r="6" fill="#ef4444"/>
  <circle cx="36" cy="16" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="16" r="6" fill="#22c55e"/>
  <text x="400" y="20" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">MineAI IDE - AI Code Generation</text>
  
  <!-- AI Chat Panel (left side) -->
  <rect x="10" y="42" width="350" height="398" fill="#0f172a" rx="8"/>
  <text x="30" y="70" font-family="Arial" font-size="14" fill="#fff" font-weight="bold">🤖 AI Assistant</text>
  
  <!-- User message -->
  <rect x="30" y="90" width="310" height="60" fill="#334155" rx="8"/>
  <text x="45" y="110" font-family="Arial" font-size="11" fill="#94a3b8">You:</text>
  <text x="45" y="130" font-family="Arial" font-size="12" fill="#fff">Create a ruby sword with 15 damage</text>
  <text x="45" y="145" font-family="Arial" font-size="12" fill="#fff">that glows and shoots fireballs</text>
  
  <!-- AI response -->
  <rect x="30" y="165" width="310" height="180" fill="#1e3a5f" rx="8"/>
  <text x="45" y="185" font-family="Arial" font-size="11" fill="#22d3ee">MineAI:</text>
  <text x="45" y="205" font-family="Arial" font-size="11" fill="#86efac">✓ Created RubySword.java</text>
  <text x="45" y="225" font-family="Arial" font-size="11" fill="#86efac">✓ Added 15 base damage</text>
  <text x="45" y="245" font-family="Arial" font-size="11" fill="#86efac">✓ Added enchanted glow effect</text>
  <text x="45" y="265" font-family="Arial" font-size="11" fill="#86efac">✓ Added right-click fireball ability</text>
  <text x="45" y="285" font-family="Arial" font-size="11" fill="#86efac">✓ Generated model JSON</text>
  <text x="45" y="305" font-family="Arial" font-size="11" fill="#86efac">✓ Created crafting recipe</text>
  <text x="45" y="330" font-family="Arial" font-size="12" fill="#fff">Files created: 4 | Lines: 127</text>
  
  <!-- Input box -->
  <rect x="30" y="380" width="310" height="40" fill="#334155" rx="8"/>
  <text x="45" y="405" font-family="Arial" font-size="12" fill="#64748b">Type your request...</text>
  
  <!-- Code Editor (right side) -->
  <rect x="370" y="42" width="420" height="398" fill="#1e293b" rx="8"/>
  <rect x="370" y="42" width="420" height="28" fill="#334155" rx="8 8 0 0"/>
  <text x="390" y="60" font-family="Arial" font-size="11" fill="#fff">RubySword.java</text>
  
  <!-- Code -->
  <text x="385" y="90" font-family="Consolas, monospace" font-size="10" fill="#c084fc">package</text>
  <text x="445" y="90" font-family="Consolas, monospace" font-size="10" fill="#fff">com.example.rubytools;</text>
  
  <text x="385" y="110" font-family="Consolas, monospace" font-size="10" fill="#c084fc">import</text>
  <text x="420" y="110" font-family="Consolas, monospace" font-size="10" fill="#fff">net.minecraft.world.item.*;</text>
  
  <text x="385" y="140" font-family="Consolas, monospace" font-size="10" fill="#c084fc">public class</text>
  <text x="460" y="140" font-family="Consolas, monospace" font-size="10" fill="#22d3ee">RubySword</text>
  <text x="530" y="140" font-family="Consolas, monospace" font-size="10" fill="#c084fc">extends</text>
  <text x="580" y="140" font-family="Consolas, monospace" font-size="10" fill="#22d3ee">SwordItem</text>
  <text x="645" y="140" font-family="Consolas, monospace" font-size="10" fill="#fff">{</text>
  
  <text x="400" y="160" font-family="Consolas, monospace" font-size="10" fill="#c084fc">private static final int</text>
  <text x="540" y="160" font-family="Consolas, monospace" font-size="10" fill="#f472b6">DAMAGE</text>
  <text x="590" y="160" font-family="Consolas, monospace" font-size="10" fill="#fff">= 15;</text>
  
  <text x="400" y="190" font-family="Consolas, monospace" font-size="10" fill="#6ee7b7">// Glow effect</text>
  <text x="400" y="210" font-family="Consolas, monospace" font-size="10" fill="#c084fc">@Override</text>
  <text x="400" y="230" font-family="Consolas, monospace" font-size="10" fill="#c084fc">public boolean</text>
  <text x="495" y="230" font-family="Consolas, monospace" font-size="10" fill="#fbbf24">isFoil</text>
  <text x="525" y="230" font-family="Consolas, monospace" font-size="10" fill="#fff">(ItemStack stack) {</text>
  <text x="420" y="250" font-family="Consolas, monospace" font-size="10" fill="#c084fc">return true</text>
  <text x="495" y="250" font-family="Consolas, monospace" font-size="10" fill="#fff">;</text>
  <text x="400" y="270" font-family="Consolas, monospace" font-size="10" fill="#fff">}</text>
  
  <text x="400" y="300" font-family="Consolas, monospace" font-size="10" fill="#6ee7b7">// Fireball on right-click</text>
  <text x="400" y="320" font-family="Consolas, monospace" font-size="10" fill="#c084fc">@Override</text>
  <text x="400" y="340" font-family="Consolas, monospace" font-size="10" fill="#c084fc">public</text>
  <text x="440" y="340" font-family="Consolas, monospace" font-size="10" fill="#22d3ee">InteractionResult</text>
  <text x="555" y="340" font-family="Consolas, monospace" font-size="10" fill="#fbbf24">use</text>
  <text x="575" y="340" font-family="Consolas, monospace" font-size="10" fill="#fff">(...</text>
  
  <!-- Typing indicator -->
  <rect x="400" y="370" width="60" height="20" fill="#6366f1" rx="4" opacity="0.8"/>
  <text x="430" y="384" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">● ● ●</text>
  
  <!-- Placeholder badge -->
  <rect x="550" y="200" width="200" height="30" fill="#6366f1" rx="15" opacity="0.9"/>
  <text x="650" y="220" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">📹 GIF Placeholder</text>
</svg>
